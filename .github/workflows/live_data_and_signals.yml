name: Cloud Live Macro, On-Chain, ETF, COT & Signal Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-data-pipeline
  cancel-in-progress: false

jobs:
  update-live-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "cloud/requirements.txt"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r cloud/requirements.txt

      - name: Fetch live Macro, On-Chain, ETF, COT & Volatility Term Structure (hourly refresh)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python cloud/fetch_macro_data.py --force
          else
            python cloud/fetch_macro_data.py --if-older-than-minutes 50
          fi

      - name: Run 24/7 15-Minute Closed-Bar Signal Scanner & Optional Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python cloud/live_signal_scanner.py

      - name: Commit & push updated cloud data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git stash push -m "cloud-data" -- data/
            git fetch origin main
            git checkout -B main origin/main
            git checkout stash@{0} -- data/
            git stash drop
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "chore(cloud): update live macro bias & closed-bar signals [skip ci]"
              git push origin main
            fi
          else
            echo "No data changes to commit."
          fi
