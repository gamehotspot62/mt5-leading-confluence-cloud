name: Cloud Daily Self-Evolving ML Retraining & Walk-Forward Optimization

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-data-pipeline
  cancel-in-progress: false

jobs:
  retrain-and-optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "cloud/requirements.txt"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r cloud/requirements.txt

      - name: Refresh Macro / On-Chain / ETF / COT Feeds
        run: python cloud/fetch_macro_data.py

      - name: Run 1-Year Self-Evolving Purged Walk-Forward Optimizer & ML Meta-Labeler
        run: python cloud/ml_optimizer.py

      - name: Refresh Live Signal Scanner & Outcome Ledger with Newly Trained ML Weights
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python cloud/live_signal_scanner.py

      - name: Commit & push optimized configs, ML weights & evolution log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git stash push -m "ml-data" -- data/
            git fetch origin main
            git checkout -B main origin/main
            git checkout stash@{0} -- data/
            git stash drop
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "chore(ml): daily 1y self-evolving walk-forward ML retrain"
              git push origin main
            fi
          else
            echo "No ML/config changes to commit."
          fi
